[project]
name = "bg-remover"
version = "0.1.0"
description = "Remove white/colored backgrounds from MP4 videos using AI"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.8.0",
    "rembg>=2.0.50",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "tqdm>=4.65.0",
    "onnxruntime-gpu>=1.16.0",
]

[project.scripts]
bg-remover = "bg_remover:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
